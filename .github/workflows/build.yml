name: Build and Publish Docker Images
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    
permissions:
  contents: write

env:
  DOCKERHUB_ORDER_REPOSITORY: learning-kafka-order
  DOCKERHUB_SHIPPING_REPOSITORY: learning-kafka-shipping
  DOCKERHUB_INVOICING_REPOSITORY: learning-kafka-invoicing

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build all 3 Spring Boot applications
      - name: Build microservices with Maven
        working-directory: microservice-kafka
        run: ./mvnw -B package -DskipTests

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build and push Order image
      - name: Build and push Order image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_ORDER_REPOSITORY }}:$IMAGE_TAG \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_ORDER_REPOSITORY }}:latest \
            ./microservice-kafka/microservice-kafka-order

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_ORDER_REPOSITORY }}:$IMAGE_TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_ORDER_REPOSITORY }}:latest

      # 6. Build and push Shipping image
      - name: Build and push Shipping image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_SHIPPING_REPOSITORY }}:$IMAGE_TAG \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_SHIPPING_REPOSITORY }}:latest \
            ./microservice-kafka/microservice-kafka-shipping

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_SHIPPING_REPOSITORY }}:$IMAGE_TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_SHIPPING_REPOSITORY }}:latest

      # 7. Build and push Invoicing image
      - name: Build and push Invoicing image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_INVOICING_REPOSITORY }}:$IMAGE_TAG \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_INVOICING_REPOSITORY }}:latest \
            ./microservice-kafka/microservice-kafka-invoicing

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_INVOICING_REPOSITORY }}:$IMAGE_TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_INVOICING_REPOSITORY }}:latest
      # 8. UPDATE HELM VALUES  ← ADD HERE
      # 8. UPDATE HELM VALUES
      - name: Update Helm image tags
        working-directory: ./helm/helm_code
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Updating Helm image tags to ${IMAGE_TAG}"
      
          yq -i '.order.image.tag = strenv(IMAGE_TAG)' values.yaml
          yq -i '.shipping.image.tag = strenv(IMAGE_TAG)' values.yaml
          yq -i '.invoicing.image.tag = strenv(IMAGE_TAG)' values.yaml
      
          echo "Updated values.yaml:"
          cat values.yaml
      
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          git add values.yaml
      
          git diff --cached
      
          git commit -m "Update image tags to ${IMAGE_TAG}" || echo "No changes to commit"
      
          # Get latest changes from GitHub before pushing
          git fetch origin master
          git rebase origin/master
      
          # Push the rebased commit
          git push origin master
