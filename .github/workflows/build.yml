name: Build and Publish Docker Images

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

permissions:
  contents: write

env:
  DOCKERHUB_ORDER_REPOSITORY: learning-kafka-order
  DOCKERHUB_SHIPPING_REPOSITORY: learning-kafka-shipping
  DOCKERHUB_INVOICING_REPOSITORY: learning-kafka-invoicing

jobs:
  # --------------------------------------------------
  # NEW JOB: figure out which service folders actually
  # changed in this push/PR, so we don't rebuild
  # services that nobody touched.
  # --------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      order: ${{ steps.filter.outputs.order }}
      shipping: ${{ steps.filter.outputs.shipping }}
      invoicing: ${{ steps.filter.outputs.invoicing }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect which service folders changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            order:
              - 'microservice-kafka/microservice-kafka-order/**'
            shipping:
              - 'microservice-kafka/microservice-kafka-shipping/**'
            invoicing:
              - 'microservice-kafka/microservice-kafka-invoicing/**'

  build:
    needs: changes
    # Skip the whole build job if NONE of the 3 services changed
    if: needs.changes.outputs.order == 'true' || needs.changes.outputs.shipping == 'true' || needs.changes.outputs.invoicing == 'true'
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # --------------------------------------------------
      # Maven Build
      # Builds all Maven modules using the root POM
      # --------------------------------------------------
      - name: Build microservices with Maven
        working-directory: microservice-kafka
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      # --------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # Build and Push ORDER — only if order/ changed
      # --------------------------------------------------
      - name: Build and push Order image
        if: needs.changes.outputs.order == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_ORDER_REPOSITORY }}:${IMAGE_TAG} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_ORDER_REPOSITORY }}:latest \
            ./microservice-kafka/microservice-kafka-order

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_ORDER_REPOSITORY }}:${IMAGE_TAG}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_ORDER_REPOSITORY }}:latest

      # --------------------------------------------------
      # Build and Push SHIPPING — only if shipping/ changed
      # --------------------------------------------------
      - name: Build and push Shipping image
        if: needs.changes.outputs.shipping == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_SHIPPING_REPOSITORY }}:${IMAGE_TAG} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_SHIPPING_REPOSITORY }}:latest \
            ./microservice-kafka/microservice-kafka-shipping

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_SHIPPING_REPOSITORY }}:${IMAGE_TAG}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_SHIPPING_REPOSITORY }}:latest

      # --------------------------------------------------
      # Build and Push INVOICING — only if invoicing/ changed
      # --------------------------------------------------
      - name: Build and push Invoicing image
        if: needs.changes.outputs.invoicing == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_INVOICING_REPOSITORY }}:${IMAGE_TAG} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_INVOICING_REPOSITORY }}:latest \
            ./microservice-kafka/microservice-kafka-invoicing

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_INVOICING_REPOSITORY }}:${IMAGE_TAG}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_INVOICING_REPOSITORY }}:latest

      # --------------------------------------------------
      # Update Helm values — only touch the lines for
      # services that actually changed and were rebuilt
      # --------------------------------------------------
      - name: Update Helm image tags
        if: github.event_name == 'push'
        working-directory: ./helm/helm_code
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Updating Helm image tags to ${IMAGE_TAG} (only for changed services)"

          if [ "${{ needs.changes.outputs.order }}" == "true" ]; then
            yq -i '.order.image.tag = strenv(IMAGE_TAG)' values.yaml
            echo "Updated order tag"
          fi

          if [ "${{ needs.changes.outputs.shipping }}" == "true" ]; then
            yq -i '.shipping.image.tag = strenv(IMAGE_TAG)' values.yaml
            echo "Updated shipping tag"
          fi

          if [ "${{ needs.changes.outputs.invoicing }}" == "true" ]; then
            yq -i '.invoicing.image.tag = strenv(IMAGE_TAG)' values.yaml
            echo "Updated invoicing tag"
          fi

          echo "Updated values.yaml:"
          cat values.yaml

      # --------------------------------------------------
      # Commit Helm changes
      # --------------------------------------------------
      - name: Commit Helm image tag changes
        if: github.event_name == 'push'
        working-directory: ./helm/helm_code
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update image tags to ${IMAGE_TAG}"

      # --------------------------------------------------
      # Rebase latest master and push
      # --------------------------------------------------
      - name: Push Helm changes
        if: github.event_name == 'push'
        run: |
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
